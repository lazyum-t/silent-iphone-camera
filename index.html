<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>無音カメラ — iPhone純正風カメラ</title>
  <script>
  (()=>{
    const V="20261126-210000",SK="__ag_upd_snap__",TK="__ag_upd_try__",AK="__ag_upd_at__";
    try{
      const u=new URL(location.href);
      if(u.searchParams.has("_v")){
        u.searchParams.delete("_v");
        history.replaceState(history.state,"",u.pathname+u.search+u.hash);
      }
    }catch(_){}
    const dirty=new Set();
    const elKey=(el)=>{
      if(!el)return null;
      if(el.id)return "#"+el.id;
      const dk=el.getAttribute&&el.getAttribute("data-key");
      if(dk)return '[data-key="'+dk+'"]';
      if(el.name)return el.tagName+'[name="'+el.name+'"]';
      return null;
    };
    const markDirty=(e)=>{const k=elKey(e.target);if(k)dirty.add(k);};
    document.addEventListener("input",markDirty,true);
    document.addEventListener("change",markDirty,true);
    const captureSnapshot=()=>{
      try{
        if(typeof window.__APP_BEFORE_UPDATE__==="function"){
          try{window.__APP_BEFORE_UPDATE__();}catch(_){}
        }
        if(document.readyState==="loading")return;
        const fields={};
        dirty.forEach((k)=>{
          const el=k.startsWith("#")?document.getElementById(k.slice(1)):document.querySelector(k);
          if(!el||el.type==="file"||el.type==="password"||el.type==="submit"||el.type==="button")return;
          if(el.type==="checkbox"||el.type==="radio")fields[k]={t:"c",v:el.checked};
          else fields[k]={t:"v",v:el.value};
        });
        if(Object.keys(fields).length>0||window.scrollY>0){
          sessionStorage.setItem(SK,JSON.stringify({at:Date.now(),y:window.scrollY||0,fields}));
        }
      }catch(_){}
    };
    const restoreSnapshot=()=>{
      try{
        const raw=sessionStorage.getItem(SK);
        if(!raw)return;
        sessionStorage.removeItem(SK);
        const snap=JSON.parse(raw);
        if(!snap||Date.now()-(snap.at||0)>30000)return;
        const apply=()=>{
          try{
            const f=snap.fields||{};
            Object.keys(f).forEach((k)=>{
              const el=k.startsWith("#")?document.getElementById(k.slice(1)):document.querySelector(k);
              if(!el)return;
              const d=f[k];
              if(d.t==="c"){
                if(el.checked!==d.v){el.checked=d.v;el.dispatchEvent(new Event("change",{bubbles:true}));}
              }else if(typeof d.v==="string"&&el.value!==d.v){
                el.value=d.v;
                el.dispatchEvent(new Event("input",{bubbles:true}));
                el.dispatchEvent(new Event("change",{bubbles:true}));
              }
            });
            if(snap.y>0)window.scrollTo(0,snap.y);
          }catch(_){}
        };
        if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(apply,60),{once:true});
        else setTimeout(apply,60);
      }catch(_){}
    };
    restoreSnapshot();
    let pendingVer=null,reloading=false,lastCheck=0;
    const canReload=()=>{
      if(typeof window.__APP_CAN_RELOAD__==="function"){
        try{return !!window.__APP_CAN_RELOAD__();}catch(_){return true;}
      }
      return true;
    };
    const applyUpdate=async(nextVer)=>{
      if(reloading)return;
      if(!canReload()){pendingVer=nextVer;return;}
      reloading=true;pendingVer=null;
      captureSnapshot();
      try{sessionStorage.setItem(TK,nextVer);sessionStorage.setItem(AK,String(Date.now()));}catch(_){}
      try{
        if("caches"in window){const ks=await caches.keys();await Promise.all(ks.map((k)=>caches.delete(k)));}
        if("serviceWorker"in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map((r)=>r.update().catch(()=>{})));}
      }catch(_){}
      const u=new URL(location.href);
      u.searchParams.set("_v",nextVer);
      location.replace(u.toString());
    };
    const check=async(force)=>{
      if(reloading)return;
      const now=Date.now();
      if(!force&&now-lastCheck<3000)return;
      lastCheck=now;
      const ac=typeof AbortController!=="undefined"?new AbortController():null;
      const tm=ac?setTimeout(()=>ac.abort(),4000):null;
      try{
        const r=await fetch("./version.json?t="+now,{cache:"no-store",signal:ac?ac.signal:undefined});
        if(!r.ok)return;
        const d=await r.json();
        const nv=d&&typeof d.v==="string"?d.v.trim():"";
        if(!nv||nv===V)return;
        try{
          if(sessionStorage.getItem(TK)===nv&&now-Number(sessionStorage.getItem(AK)||0)<30000)return;
        }catch(_){}
        applyUpdate(nv);
      }catch(_){}
      finally{if(tm)clearTimeout(tm);}
    };
    window.__APP_VERSION__=V;
    window.__APP_CHECK_UPDATE__=()=>check(true);
    window.__APP_NOTIFY_SAFE_TO_RELOAD__=()=>{if(pendingVer)applyUpdate(pendingVer);};
    check(true);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check(false);});
    window.addEventListener("pageshow",(e)=>{if(e.persisted)check(true);});
    setInterval(()=>{if(pendingVer&&canReload())applyUpdate(pendingVer);},1500);
  if("serviceWorker"in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"}).catch(()=>{});},{once:true});}
  })();
  </script>

<body>
  <div id="app" class="camera-app">

        <button id="btn-auto-save" class="pill-btn active" type="button" aria-label="写真アプリへ即保存切替" title="撮影後にiOS写真アプリ保存メニューを開く">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <span>無音</span>
        </span>
      </div>

      <div class="top-center">
        <button id="btn-drawer-toggle" class="chevron-btn" type="button" aria-label="詳細設定を開く" aria-expanded="false">

            <polyline points="18 15 12 9 6 15"/>
          </svg>
        </button>
        <div id="recording-timer" class="recording-timer hidden">
          <span class="rec-dot"></span>
          <span id="recording-time-text">00:00</span>
        </div>
      </div>

      <div class="top-right">
        <button id="btn-top-exposure" class="circle-icon-btn" type="button" aria-label="露出調整">
          <span class="ev-symbol">±</span>
        </button>
        <button id="btn-top-filter" class="circle-icon-btn" type="button" aria-label="フィルター">
          <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8.5" r="4.8"/>
            <circle cx="8.5" cy="14.5" r="4.8"/>
            <circle cx="15.5" cy="14.5" r="4.8"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ビューファインダーエリア -->
    <main class="viewfinder-stage" id="viewfinder-stage">
      <div class="viewfinder-frame aspect-full" id="viewfinder-frame">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="freeze-canvas" class="freeze-canvas hidden" aria-hidden="true"></canvas>
        <canvas id="capture-canvas" class="hidden"></canvas>

        <!-- ポートレートぼかしオーバーレイ（周辺ソフトフォーカス） -->
        <div id="portrait-overlay" class="portrait-overlay hidden"></div>

        <!-- グリッド線（3x3） -->
        <div id="grid-overlay" class="grid-overlay hidden" aria-hidden="true">
          <div class="grid-line-v v1"></div>
          <div class="grid-line-v v2"></div>
          <div class="grid-line-h h1"></div>
          <div class="grid-line-h h2"></div>
        </div>

        <!-- 水平器 -->
        <div id="level-overlay" class="level-overlay hidden" aria-hidden="true">
          <div class="level-track">
            <div class="level-tick left"></div>
            <div class="level-bar" id="level-bar"></div>
            <div class="level-tick right"></div>
          </div>
        </div>

        <!-- AE/AFロック バッジ -->
        <div id="ae-af-badge" class="ae-af-badge hidden">AE/AFロック</div>

        <!-- レンズ名/状態トースト -->
        <div id="status-pill" class="status-pill hidden"></div>

        <!-- タップフォーカス & 露出スライダー -->

          <div class="focus-box"></div>
          <div class="focus-sun-slider" id="focus-sun-slider">
            <div class="sun-line top"></div>
            <div class="sun-icon" id="focus-sun-icon">☀</div>
            <div class="sun-line bottom"></div>
          </div>
        </div>

        <!-- タイマーカウントダウン -->
        <div id="timer-countdown" class="timer-countdown hidden">3</div>

        <!-- シャッターフラッシュ（無音撮影フィードバック） -->
        <div id="shutter-flash" class="shutter-flash"></div>

        <!-- フリップ切替時のブラー -->
        <div id="flip-blur" class="flip-blur"></div>

        <!-- カメラ未起動・エラー・権限要求オーバーレイ -->
        <div id="camera-permission-overlay" class="permission-overlay">
          <div class="permission-card">
            <div class="permission-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <h1 id="permission-title">無音カメラ</h1>
            <p id="permission-desc">シャッター音なしで超広角・広角・望遠撮影ができます。カメラへのアクセスを許可してください。</p>
            <button id="btn-start-camera" class="btn-primary-yellow" type="button">カメラを起動</button>
            <p class="permission-note" id="permission-note"></p>
          </div>
        </div>

        <!-- カメラ上部ズームバー（タッチ判定広め） -->
        <div class="zoom-wheel hidden" id="zoom-wheel">
          <div class="zoom-wheel-header">
            <span class="zoom-wheel-label">ズーム</span>
            <span class="zoom-wheel-value" id="zoom-wheel-value">1.0×</span>
          </div>
          <input id="zoom-range-slider" type="range" min="0.5" max="10" step="0.1" value="1" aria-label="ズーム倍率" />
        </div>

        <!-- レンズ倍率セレクター（0.5 / 1x / 2 / 3） -->
        <div class="zoom-controls-wrap" id="zoom-controls-wrap">
          <div class="lens-selector" id="lens-selector" role="group" aria-label="レンズ倍率切替">
            <!-- JSで検出レンズに合わせて動的生成（デフォルト: 0.5, 1x, 2, 3） -->
          </div>
        </div>
      </div>

      <!-- 撮影直後のワンタップ保存トースト（自動シートがブロックされた時や即時アクセス用） -->
      <div id="quick-save-toast" class="quick-save-toast hidden">
        <img id="quick-save-thumb" class="quick-save-thumb" alt="撮影した写真" />
        <div class="quick-save-info">
          <span id="quick-save-msg">撮影しました（無音）</span>
          <span class="quick-save-sub">タップしてiOS「写真」アプリに保存</span>
        </div>
        <button id="btn-quick-save-now" class="quick-save-btn" type="button">写真に保存</button>
      </div>
    </main>

    <!-- 詳細コントロールパネル（純正カメラの ^ 展開ドロワー） -->
    <section id="control-drawer" class="control-drawer hidden" aria-label="カメラ詳細コントロール">
      <!-- サブコントロール：露出スライダー -->
      <div id="subpanel-exposure" class="subpanel hidden">
        <div class="subpanel-header">
          <span>露出</span>
          <span id="exposure-value-label" class="accent-yellow">0.0</span>
          <button id="btn-exposure-reset" class="text-reset-btn" type="button">リセット</button>
        </div>
        <input id="exposure-slider" class="ios-slider" type="range" min="-2" max="2" step="0.1" value="0" />
      </div>

      <!-- サブコントロール：フィルター選択 -->
      <div id="subpanel-filters" class="subpanel hidden">
        <div class="filter-strip" id="filter-strip"></div>
      </div>

      <!-- サブコントロール：物理レンズ直接選択 -->
      <div id="subpanel-lenses" class="subpanel hidden">
        <div class="subpanel-header">
          <span>検出されたカメラレンズ</span>
          <span id="lens-count-label" class="muted-label"></span>
        </div>
        <div class="lens-chip-list" id="lens-chip-list"></div>
      </div>

      <!-- メインツールアイコン列 -->
      <div class="drawer-tools">
        <button class="drawer-tool-btn" id="tool-aspect" type="button">
          <span class="tool-badge" id="tool-aspect-val">フル</span>
          <span class="tool-label">比率</span>
        </button>
        <button class="drawer-tool-btn" id="tool-timer" type="button">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <polyline points="12 9 12 13 15 15"/>
            <line x1="9" y1="2" x2="15" y2="2"/>
          </svg>
          <span class="tool-label" id="tool-timer-val">オフ</span>
        </button>
        <button class="drawer-tool-btn" id="tool-exposure" type="button">
          <span class="tool-badge">±</span>
          <span class="tool-label" id="tool-exposure-val">0.0</span>
        </button>
        <button class="drawer-tool-btn" id="tool-filter" type="button">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8.5" r="4.5"/>
            <circle cx="8.5" cy="14.5" r="4.5"/>
            <circle cx="15.5" cy="14.5" r="4.5"/>
          </svg>
          <span class="tool-label" id="tool-filter-val">オリジナル</span>
        </button>
        <button class="drawer-tool-btn" id="tool-grid" type="button">

            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
          <span class="tool-label">グリッド</span>
        </button>
        <button class="drawer-tool-btn" id="tool-level" type="button">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <line x1="3" y1="12" x2="8" y2="12"/>
            <line x1="10" y1="12" x2="14" y2="12"/>
            <line x1="16" y1="12" x2="21" y2="12"/>
          </svg>
          <span class="tool-label">水平</span>
        </button>
        <button class="drawer-tool-btn" id="tool-mirror" type="button">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18"/>
            <polyline points="8 7 3 12 8 17"/>
            <polyline points="16 7 21 12 16 17"/>
          </svg>
          <span class="tool-label">鏡像</span>
        </button>
        <button class="drawer-tool-btn" id="tool-lenses" type="button">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="9" cy="9" r="3.5"/>
            <circle cx="16" cy="9" r="3.5"/>
            <circle cx="12.5" cy="15.5" r="3.5"/>
          </svg>
          <span class="tool-label">レンズ</span>
        </button>
      </div>
    </section>

    <!-- ボトムコントロール（モード切替 + シャッター行） -->

      <nav class="mode-selector" id="mode-selector" aria-label="撮影モード">

        <button class="mode-btn" data-mode="square" type="button">スクエア</button>

        <!-- 左：サムネイル（ギャラリーを開く） -->

            <polyline points="15 10 15 12.8 12.2 12.8"/>
            <path d="M14.5 14.5a3 3 0 0 1-5 2.2"/>
            <polyline points="9 19 9 16.2 11.8 16.2"/>
          </svg>
        </button>
      </div>
    </footer>

    <!-- ギャラリーモーダル（iOS写真風ビューア＋純正写真アプリ一括保存） -->
    <div id="gallery-modal" class="gallery-modal hidden" role="dialog" aria-modal="true" aria-label="撮影した写真">
      <header class="gallery-header">
        <button id="btn-gallery-close" class="gallery-nav-btn" type="button">カメラに戻る</button>
        <div class="gallery-title-wrap">
          <span id="gallery-title">一時保存 (0)</span>
          <span id="gallery-subtitle" class="gallery-subtitle">使用容量: 0.0 MB（本体保存で自動削除）</span>
        </div>
        <div class="gallery-header-actions">
          <button id="btn-gallery-save-all" class="gallery-save-all-btn hidden" type="button">すべて写真へ</button>
          <button id="btn-gallery-clear-all" class="gallery-clear-all-btn hidden" type="button" title="一時保存をすべて完全削除">全削除</button>
        </div>
      </header>

      <div id="gallery-content" class="gallery-content">
        <div id="gallery-empty" class="gallery-empty">
          <p>まだ撮影した写真・動画はありません</p>
        </div>
        <div id="gallery-viewer" class="gallery-viewer hidden">
          <div class="viewer-media-wrap" id="viewer-media-wrap">
            <img id="viewer-image" class="viewer-media hidden" alt="撮影写真" />
            <video id="viewer-video" class="viewer-media hidden" controls playsinline></video>
          </div>
          <div class="viewer-meta" id="viewer-meta"></div>
          <div class="viewer-actions">
            <button id="btn-viewer-save" class="viewer-action-primary" type="button">
